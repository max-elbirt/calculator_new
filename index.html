<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .calculator {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .display {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 20px 16px 12px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .expression {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      min-height: 18px;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      font-size: 40px;
      font-weight: 300;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -1px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 400;
      height: 62px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.08s ease;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(0.93);
      filter: brightness(1.2);
    }

    /* Number buttons */
    .btn-num {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-num:hover { background: rgba(255, 255, 255, 0.18); }

    /* Operator buttons */
    .btn-op {
      background: rgba(82, 130, 255, 0.25);
      color: #7eaaff;
      border: 1px solid rgba(82,130,255,0.2);
      font-size: 22px;
    }
    .btn-op:hover { background: rgba(82, 130, 255, 0.4); }

    /* Equals button */
    .btn-eq {
      background: linear-gradient(135deg, #5282ff, #8b5cf6);
      color: #ffffff;
      font-size: 24px;
      box-shadow: 0 4px 20px rgba(82, 130, 255, 0.4);
      border: none;
    }
    .btn-eq:hover { filter: brightness(1.1); }

    /* Utility buttons (AC, +/-, %) */
    .btn-util {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 16px;
    }
    .btn-util:hover { background: rgba(255, 255, 255, 0.25); }

    /* Zero button spans 2 columns */
    .btn-zero {
      grid-column: span 2;
      text-align: left;
      padding-left: 24px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-util" onclick="clear()">AC</button>
      <button class="btn-util" onclick="toggleSign()">+/−</button>
      <button class="btn-util" onclick="percent()">%</button>
      <button class="btn-op"  onclick="inputOp('/')">÷</button>

      <button class="btn-num" onclick="inputNum('7')">7</button>
      <button class="btn-num" onclick="inputNum('8')">8</button>
      <button class="btn-num" onclick="inputNum('9')">9</button>
      <button class="btn-op"  onclick="inputOp('*')">×</button>

      <button class="btn-num" onclick="inputNum('4')">4</button>
      <button class="btn-num" onclick="inputNum('5')">5</button>
      <button class="btn-num" onclick="inputNum('6')">6</button>
      <button class="btn-op"  onclick="inputOp('-')">−</button>

      <button class="btn-num" onclick="inputNum('1')">1</button>
      <button class="btn-num" onclick="inputNum('2')">2</button>
      <button class="btn-num" onclick="inputNum('3')">3</button>
      <button class="btn-op"  onclick="inputOp('+')">+</button>

      <button class="btn-num btn-zero" onclick="inputNum('0')">0</button>
      <button class="btn-num" onclick="inputDot()">.</button>
      <button class="btn-eq"  onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let previous = '';
    let operator = null;
    let justCalculated = false;

    const resultEl = document.getElementById('result');
    const exprEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = current;
      resultEl.style.fontSize = current.length > 10 ? '24px' : '40px';
    }

    function inputNum(n) {
      if (justCalculated) { current = n; justCalculated = false; }
      else current = current === '0' ? n : current + n;
      updateDisplay();
    }

    function inputDot() {
      if (justCalculated) { current = '0.'; justCalculated = false; }
      else if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function inputOp(op) {
      if (operator && !justCalculated) calculate(true);
      previous = current;
      operator = op;
      justCalculated = false;
      current = '0';
      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      exprEl.textContent = previous + ' ' + symbols[op];
    }

    function calculate(chaining = false) {
      if (!operator || previous === '') return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      let result;
      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
          if (b === 0) { current = 'Error'; operator = null; previous = ''; updateDisplay(); return; }
          result = a / b;
          break;
      }
      if (!chaining) {
        exprEl.textContent = previous + ' ' + symbols[operator] + ' ' + current + ' =';
      }
      current = parseFloat(result.toPrecision(12)).toString();
      operator = null;
      previous = '';
      justCalculated = true;
      updateDisplay();
    }

    function clear() {
      current = '0'; previous = ''; operator = null; justCalculated = false;
      exprEl.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      current = (parseFloat(current) * -1).toString();
      updateDisplay();
    }

    function percent() {
      current = (parseFloat(current) / 100).toString();
      updateDisplay();
    }

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') inputNum(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') inputOp('+');
      else if (e.key === '-') inputOp('-');
      else if (e.key === '*') inputOp('*');
      else if (e.key === '/') { e.preventDefault(); inputOp('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clear();
      else if (e.key === 'Backspace') {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        updateDisplay();
      }
    });
  </script>
</body>
</html>
